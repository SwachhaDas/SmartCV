{% extends 'portfolio/base.html' %}

{% block title %}Login - SmartCV{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h3 class="text-center mb-4">
                <i class="bi bi-box-arrow-in-right text-primary"></i> Login
            </h3>

            <form method="post">
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="alert alert-danger">
                        {{ form.non_field_errors|striptags }}
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" id="{{ form.username.id_for_label }}" required>
                </div>

                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="{{ form.password.id_for_label }}" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
            </form>

            <p class="text-center mt-3 mb-0">
                New here?
                <a href="{% url 'register' %}" class="text-primary">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
